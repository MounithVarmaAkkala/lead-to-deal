version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lead_to_deal_postgres
    environment:
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: lead_password
      POSTGRES_DB: lead_to_deal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_user -d lead_to_deal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lead_to_deal_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead_to_deal_backend
    environment:
      DATABASE_URL: postgresql://lead_user:lead_password@db:5432/lead_to_deal_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lead_to_deal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
