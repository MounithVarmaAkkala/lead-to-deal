# Render Blueprint: backend API + Postgres.
# render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: lead-to-deal-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: lead-to-deal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      # Set to your Vercel URL after the frontend deploys, e.g. https://lead-to-deal.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app

databases:
  - name: lead-to-deal-db
    plan: free
    databaseName: lead_to_deal
    user: lead_user
